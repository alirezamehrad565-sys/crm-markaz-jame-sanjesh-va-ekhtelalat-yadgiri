name = "center-system"
main = "worker/entry.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "REPLACE_WITH_YOUR_CLOUDFLARE_ACCOUNT_ID"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "center-system-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["0 17 * * *", "30 6 * * *", "0 4 * * *", "30 14 * * *"]

[vars]
ENV = "production"
CF_ACCESS_TEAM_DOMAIN = ""
CLINIC_NAME = "مرکز جامع"
PUBLIC_BASE_URL = ""

[observability]
enabled = true
