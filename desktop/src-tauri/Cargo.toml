[package]
name = "center-desktop"
version = "1.27.43"
description = "مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام — نسخهٔ میز"
edition = "2021"

# نسخهٔ پوسته = نسخهٔ منبع (APP_VERSION در src/core/version.ts) — گیت desktop:check ناهم‌گامی را می‌گیرد

[lib]
name = "center_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# rust-f7 — مخزن امن رازهای اتصال ابر (Credential Manager ویندوز؛ در CI لینوکس با secret-service)
# فاز B — فیچرهای صریح طبق docs.rs/keyring/3.6.3 (آخرین نسخهٔ ۳.x، ۲۰۲۵-۰۷-۲۷؛ کریت بدون
# فیچر پیش‌فرض است و باید پلتفرم ذخیره‌ساز صریح انتخاب شود):
#   windows-native       → Credential Store ویندوز (پلتفرم هدف نصاب — secure_store.rs)
#   sync-secret-service  → مخزن Secret Service دی‌باس روی لینوکس/CI با API همگام
#                          (get_password/set_password بدون async-runtime)
#   crypto-rust          → رمزنگاری pure-Rust بستهٔ انتقال secret-service (بدون OpenSSL سیستم)
#   vendored             → لینک استاتیک کتابخانه‌های لازم در بیلد CI (بدون dev-lib سیستم)
# نسخه ۳ می‌ماند تا با secure_store.rs موجود سازگار بماند — خط ۴.x (crates.io: ۴.۲.۰)
# ساختار فیچر متفاوت دارد و مهاجرت آن خارج از فاز B است.
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
# v1.26.0 — ماژول کلادفلر (cf_deploy.rs): HTTPS با rustls (بدون OpenSSL) + multipart آپلود ورکر
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
# runtime async تائوری روی tokio است — انتظار بین پروب‌های healthz
tokio = { version = "1", features = ["time"] }
# پیگیری مایگریشن‌ها (deploy_plan.rs) — checksum فایل‌ها؛ تنها وابستهٔ جدید مجاز (pure-Rust، بدون کتابخانهٔ سیستم)
sha2 = "0.10"
# فاز D — OTA چهارگانه (server-cloud-update-design.md §۳): پلاگین رسمی updater — کانال خودکار
# فقط با امضای minisign از CI (راز TAURI_UPDATER_PUBKEY در بیلد)؛ کانال دستی مستقل از آن کار می‌کند
tauri-plugin-updater = "2"
# F — تکی‌نمونه (بستن ریسک #۱۰): نمونهٔ دوم بلافاصله بسته می‌شود و کاربر به پنجرهٔ موجود
# برمی‌گردد — جلوگیری از دو موتور/دو پنجره روی یک dataDir. باید اولین plugin زنجیرهٔ builder باشد.
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
