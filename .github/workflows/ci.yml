name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: گیت‌های انتشار — ف۳ (تایپ، آزمون، بودجه، همگامی اسناد، امنیت وابستگی‌ها)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ف۳ — از ۱.۲۵.۶۹ zod@4.6.7 (GHSA-mrhx-c7xc-m3w5 بسته شد) و npm audit بلاک‌کننده است:
      # هر HIGH تازه در درخت تولید = قرمز CI. دامنهٔ گیت فقط درخت تولید است؛
      # درخت dev (زنجیرهٔ wrangler→miniflare→@fastify/busboy) بدهی جداست و ارتقای کنترل‌شدهٔ wrangler جداگانه می‌رود.
      - name: npm audit (deps production — بلاک‌کننده از ف۳)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (tsc strict)
        run: npm run typecheck

      - name: Unit & e2e tests (vitest)
        run: npm test

      - name: Build client bundle (boot + چانک‌های نما)
        run: npm run build:client

      - name: Build worker bundle از منبع (بازتولیدپذیری)
        run: node scripts/build-worker-bundle.mjs

      - name: Bundle syntax check (node --check)
        run: node --check worker/bundle.js

      - name: Build games worker bundle
        run: node scripts/build-worker-games.mjs

      # v1.27.۰۳ — گیت فاز ۲ دوهاته: موتور توسعهٔ workerd و موتور دسکتاپ adapter (نصاب)
      - name: Engine smoke — workerd (حالت توسعه)
        run: node scripts/engine/engine-smoke.mjs

      - name: Engine smoke — adapter (موتور درون‌پروسه‌ای نصاب — بدون workerd)
        run: SMOKE_ENGINE=adapter node scripts/engine/engine-smoke.mjs

      - name: Performance budget (پیل بوت/CSS/فونت)
        run: node scripts/perf-budget.mjs

      # ف۲ — گیت همگامی MIGRATIONS.md: هر فایل مایگریشن باید سطر سند داشته باشد
      - name: MIGRATIONS.md sync gate
        run: node scripts/check-migrations-doc.mjs

      # v1.26.0 — گیت سازگاری D1: پورت جداکنندهٔ cf_deploy.rs + اجرای کامل schema.sql روی SQLite
      # و برابری sqlite_master با مسیر فایل‌به‌فایل — «همان SQL به موتور محلی و markaz-central می‌رود»
      - name: D1 compatibility gate (schema.sql ↔ Cloudflare D1)
        run: node scripts/check-d1-compat.mjs

      # ف۲ — گیت دیسدیپلین هش CSP: بلاک inline ↔ هش‌های _headers
      - name: CSP hash discipline gate
        run: node scripts/check-csp-hash.mjs

      # bundle-smoke عمداً این‌جا نیست: مقایسهٔ رفتاری «باندل زندهٔ تولید ↔ بازسازی» است
      # و فقط در چرخهٔ انتشار محلی (کنار باندل کهنه) معنا دارد — آیتم ۶ §۳-۱۶ سند.

      # ⚠️ «Golden engine tests» حذف شد — موتور صورت‌بندی از (بازسازی esbuild باندل از src)
      # دیگر جزو باندل سرور نیست (مصرف‌کنندهٔ آن فقط فرانت‌اند است: public/assets/js/case-formulation.js)
      # و فرضِ آزمون «برابری src با باندل» بی‌معنا شده بود؛ از آن پس این استپ همیشه قرمز بود.
      # پاریتی رفتار سرور اکنون با scripts/bundle-smoke.mjs + تست‌های مسیر پوشش داده می‌شود.

      - name: Self-host build & smoke (پایهٔ ایمیج داکر GHCR)
        run: |
          npm run build:selfhost
          DATA_DIR="$(mktemp -d)" PORT=3199 HOST=127.0.0.1 node dist/server.js & SRV=$!
          sleep 6
          curl -fsS http://127.0.0.1:3199/health | grep -q '"ok":true'
          curl -fsS -o /dev/null -w 'index: %{http_code}\n' http://127.0.0.1:3199/
          kill "$SRV"
