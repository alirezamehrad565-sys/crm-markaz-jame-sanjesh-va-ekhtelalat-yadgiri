name: Deploy (Cloudflare)
# انتشار خودکار تولیدی با هر پوش مؤثر روی main:
# پشتیبان D1 → مایگریشن → deploy → دروازهٔ سلامت ×۳ → رولبک خودکار (scripts/update-remote.mjs)
# اعتبارها از رازهای مخزن: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'scripts/update-remote.mjs'
      - 'scripts/build-worker-bundle.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "رد کردن پشتیبان‌گیری D1 (پیش‌فرض: بکاپ گرفته شود)"
        required: false
        default: "false"

concurrency:
  group: cf-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: backup → migrate → deploy → health ×3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: انتشار تولیدی (update-remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ARGS="--yes"
          if [ "${{ inputs.skip_backup }}" = "true" ]; then ARGS="--yes --skip-backup"; fi
          node scripts/update-remote.mjs $ARGS

      - name: آپلود پشتیبان D1 به آرتیفکت اجرا
        if: hashFiles('backups/*.sql') != ''
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: backups/
          retention-days: 30
          if-no-files-found: ignore
