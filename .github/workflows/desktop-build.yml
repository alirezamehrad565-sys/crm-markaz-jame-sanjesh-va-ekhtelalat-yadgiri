# گردش‌کار CI دسکتاپ (خط rust) — کامپایل و بسته‌بندی Tauri
# بدون هیچ عملیات Cloudflare — فقط کامپایل Rust، بیلد NSIS و مونتاژ پک USB
name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [rust]

permissions:
  contents: read

jobs:
  cargo-check:
    name: بررسی کامپایل پوستهٔ Rust (لینوکس)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: وابستگی‌های سیستم برای cargo check گیت‌های Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: cargo check پوستهٔ دسکتاپ (engine.rs / lib.rs / main.rs)
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

  windows-build:
    name: بیلد ویندوز — نصاب NSIS + پک USB
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: نصب وابستگی‌ها و ساخت کلاینت (پر کردن frontendDist)
        run: |
          npm ci
          npm run build:client
      - name: بیلد Tauri → نصاب NSIS فارسی (Setup.exe)
        run: npx @tauri-apps/cli@2 build
      - name: مونتاژ پک USB — کپی خودکار Setup.exe از خروجی NSIS
        run: npm run usb:pack
      - uses: actions/upload-artifact@v4
        with:
          name: usb-pack
          path: |
            dist/usb-pack/
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
