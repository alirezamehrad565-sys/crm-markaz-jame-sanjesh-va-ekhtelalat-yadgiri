# گردش‌کار CI دسکتاپ (خط rust) — کامپایل و بسته‌بندی Tauri
# بدون هیچ عملیات Cloudflare — فقط کامپایل Rust، بیلد NSIS و مونتاژ پک USB
name: desktop-build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "ساخت ریلیز draft + latest.json + امضای updater (فاز D — از پل sync-main-to-rust صدا زده می‌شود)"
        required: false
        default: "false"
  push:
    branches: [rust]

permissions:
  contents: read

jobs:
  cargo-check:
    name: بررسی کامپایل پوستهٔ Rust (لینوکس)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: وابستگی‌های سیستم برای cargo check گیت‌های Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # v1.27.۱۹ — گیت هم‌مِهری نسخه‌ها پیش از هر مونتاژ: منشأ گزارش کارفرما (CARGO_PKG_VERSION
      # جامانده روی ۱.۲۷.۱۴ → گیت «نصب ارتقا ناقص» پوسته بوت نصاب تازه را نمی‌گذراند)
      - name: گیت هم‌مِهری نسخه‌ها (check-versions)
        run: node scripts/check-versions.mjs
      - name: مونتاژ رانتایم نصاب لینوکس — سایدکار workerd (tauri-build در کامپایل هم externalBin را الزامی می‌داند)
        run: |
          npm ci
          node scripts/desktop/build-installer-runtime.mjs --target x86_64-unknown-linux-gnu
      - name: cargo check پوستهٔ دسکتاپ (engine.rs / lib.rs / main.rs)
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test پوستهٔ دسکتاپ (تست‌های واحد verify_runtime_integrity / چرخش لاگ / install-manifest)
        working-directory: desktop/src-tauri
        run: cargo test --all-targets

  windows-build:
    name: بیلد ویندوز — نصاب NSIS + پک USB
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # v1.27.۱۹ — گیت هم‌مِهری نسخه‌ها پیش از بیلد نصاب ویندوز (عین جاب لینوکس)
      - name: گیت هم‌مِهری نسخه‌ها (check-versions)
        run: node scripts/check-versions.mjs
      - name: نصب وابستگی‌ها و ساخت کلاینت (پر کردن frontendDist)
        run: |
          npm ci
          npm run build:client
      - name: مونتاژ رانتایم نصاب — سایدکار workerd پین‌شده + قالب capnp + d1-seed + ثبت هش (rust-f13)
        run: node scripts/desktop/build-installer-runtime.mjs --target x86_64-pc-windows-msvc
      - name: بیلد Tauri — تلاش نخست (کش‌شدن NSIS بستهٔ تائوری؛ زبان فارسی در توزیع NSIS تائوری نیست → شکست انتظارشده)
        run: npx @tauri-apps/cli@2 build
        continue-on-error: true
      - name: افزودن زبان فارسی به NSIS کش‌شده (Farsi→Persian از مخزن رسمی nsis-dev/nsis)
        shell: pwsh
        run: |
          $lang = "$env:LOCALAPPDATA\tauri\NSIS\Contrib\Language files"
          if (-not (Test-Path "$lang\..\..\Bin\makensis.exe")) { throw "NSIS کش نشد — تلاش نخست را بررسی کنید" }
          $base = 'https://raw.githubusercontent.com/nsis-dev/nsis/master/Contrib/Language%20files'
          Invoke-WebRequest "$base/Farsi.nlf" -OutFile "$lang\Persian.nlf"
          Invoke-WebRequest "$base/Farsi.nsh" -OutFile "$lang\Persian.nsh"
          Get-ChildItem "$lang\Persian.*" | Select-Object Name, Length
      - name: بیلد Tauri → نصاب NSIS فارسی (Setup.exe) — تلاش دوم
        run: npx @tauri-apps/cli@2 build
      - name: مونتاژ پک USB — کپی خودکار Setup.exe از خروجی NSIS
        run: npm run usb:pack
      - uses: actions/upload-artifact@v4
        with:
          name: usb-pack
          path: |
            dist/usb-pack/
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: ریلیز draft + latest.json + امضای updater (فاز D — فقط با ورودی release=true؛ publish فقط دستی کارفرما)
        if: github.event_name == 'workflow_dispatch' && inputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          VER=$(grep -o "APP_VERSION = '[^']*'" src/core/version.ts | cut -d"'" -f2)
          EXE=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          SIG_ARGS=()
          if [ -n "$TAURI_UPDATER_PRIVATE_KEY" ]; then
            npx @tauri-apps/cli@2 signer sign -k "$TAURI_UPDATER_PRIVATE_KEY" -p "$TAURI_UPDATER_PRIVATE_KEY_PASSWORD" "$EXE"
            SIG_ARGS=(--sig "${EXE}.sig")
          else
            echo "⚠ راز TAURI_UPDATER_PRIVATE_KEY تنظیم نشده — latest.json بی‌امضا؛ کانال خودکار فعال نمی‌شود، کانال دستی سالم است"
          fi
          node scripts/make-latest-json.mjs --installer "$EXE" "${SIG_ARGS[@]}" --out latest.json
          gh release create "v$VER" --draft --target "$GITHUB_SHA" \
            --title "دسکتاپ v$VER (draft)" \
            --generate-notes "$EXE#نصاب-ویندوز-NSIS" latest.json#latest.json
