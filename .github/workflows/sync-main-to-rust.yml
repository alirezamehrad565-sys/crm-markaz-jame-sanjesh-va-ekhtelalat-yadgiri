name: پل هم‌گام‌سازی main → rust
# طراحی §۴ server-cloud-update-design.md — تغییرات فرانت‌اند main به اپلیکیشن rust می‌رسد.
# قاعدهٔ سخت: پل هرگز مستقیم به rust push نمی‌کند — همیشه PR (بازبینی + نقطهٔ توقف کارفرما).
# publish ریلیز draft فقط دستی کارفرما انجام می‌شود (متغیر AUTO_SYNC_MERGE بعداً از تصمیم §۵-۴).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: sync-main-to-rust
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr:
    name: merge main → rust + بامپ پچ + گیت‌ها + PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout شاخهٔ rust (تاریخچهٔ کامل برای merge)
        uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: merge origin/main
        id: merge
        run: |
          git config user.name "پل CI چهارگانه"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: تعارض → شاخهٔ برچسب‌دار + PR حل دستی (توقف امن — هیچ pushی به rust)
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFLICTED=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          BR="sync/conflict-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BR"
          git add -A
          git commit -m "تعارض merge main→rust — حل دستی لازم است (فایل‌ها: ${CONFLICTED:-نامشخص})"
          git push origin "$BR"
          gh label create "تعارض" --color d93f0b --force 2>/dev/null || true
          gh pr create --base rust --head "$BR" \
            --title "پل main→rust — تعارض حل‌نشده (حل دستی لازم است)" \
            --label "تعارض" \
            --body "مرج خودکار main به rust با تعارض مواجه شد و طبق طراحی §۴ متوقف شد. فایل‌های تعارضی: ${CONFLICTED:-نامشخص} — محتوای تعارض‌دار روی این شاخه ذخیره شده تا بازبینی دستی آسان باشد. هیچ چیز مستقیم به rust push نشده است."

      - name: بامپ پچ خودکار (شش‌نقطه‌ای با اسکریپت خود مخزن)
        id: bump
        if: steps.merge.outputs.conflict == 'false'
        run: |
          CUR=$(grep -o "APP_VERSION = '[^']*'" src/core/version.ts | cut -d"'" -f2)
          MA=$(echo "$CUR" | awk -F. '{print $1}')
          MI=$(echo "$CUR" | awk -F. '{print $2}')
          PA=$(echo "$CUR" | awk -F. '{print $3+1}')
          NEXT="$MA.$MI.$PA"
          node scripts/bump-version.mjs "$NEXT" --from "$CUR"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: گیت‌ها روی نتیجهٔ merge (build + tsc + vitest + هم‌مِهری نسخه‌ها + desktop-check)
        if: steps.merge.outputs.conflict == 'false'
        run: |
          npm ci
          npm run build:client
          npm run typecheck
          npm test
          node scripts/check-versions.mjs
          npm run desktop:check

      - name: push شاخهٔ sync
        id: branch
        if: steps.merge.outputs.conflict == 'false'
        run: |
          BR="sync/main-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BR"
          git push origin "$BR"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: راه‌اندازی desktop-build با ریلیز draft روی شاخهٔ sync (build ویندوز + امضا + latest.json)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run desktop-build.yml --ref "${{ steps.branch.outputs.branch }}" -f release=true

      - name: PR sync با یادداشت خودکار (تأیید کارفرما → merge)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMITS=$(git log --oneline origin/rust..origin/main | head -30)
          cat > pr-body.md <<EOF
          ## پل main→rust — دسکتاپ v${{ steps.bump.outputs.next }}

          مرج خودکار شاخهٔ main + بامپ پچ به v${{ steps.bump.outputs.next }} (اسکریپت شش‌نقطه‌ای خود مخزن).

          **گیت‌های روی همین اجرا:** build:client · typecheck · vitest کامل · check-versions · desktop-check — سبز.
          **build ویندوز + امضا + latest.json:** ورک‌فلو desktop-build با ورودی release=true روی شاخهٔ sync در حال اجراست؛ ریلیز **draft** ساخته می‌شود.

          **قاعدهٔ سخت:** این PR تنها مسیر رسیدن main به rust است — publish ریلیز فقط دستی کارفرما.

          **کامیت‌های main که می‌آیند:**
          ${COMMITS}
          EOF
          gh pr create --base rust --head "${{ steps.branch.outputs.branch }}" \
            --title "پل main→rust — دسکتاپ v${{ steps.bump.outputs.next }}" \
            --body-file pr-body.md
