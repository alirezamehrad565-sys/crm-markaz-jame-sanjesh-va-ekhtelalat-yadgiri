# ایمیج داکر سلف‌هاست: با هر پوش مؤثر روی main و هر تگ v* خودکار به GHCR می‌رود.
# ایمیج: ghcr.io/<owner>/<repo> · تگ‌ها: main → latest/main/sha · تگ v1.27.24 → 1.27.24/1.27/latest
# پلتفرم‌ها: linux/amd64 + linux/arm64
name: Docker (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/build-selfhost.mjs'
      - 'scripts/bootstrap.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (برای build چندمعماری)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (تگ‌ها و لیبل‌های OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # نام مخزن خودکار به حروف کوچک تبدیل می‌شود (الزام GHCR)
          tags: |
            # latest = پوش روی main یا هر تگ نسخهٔ v*
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            # نکته: نسخه‌های پروژه (1.00.57) صفر پیش‌رو دارند و semver سخت‌گیر نیستند؛
            # به همین دلیل به‌جای type=semver از type=match با رجکس استفاده می‌کنیم
            type=match,pattern=v(\d+\.\d+\.\d+),group=1
            type=match,pattern=v(\d+\.\d+)\.\d+,group=1
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Center System (Self-host)
            org.opencontainers.image.description=مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام — نسخهٔ سلف‌هاست روی Node.js + SQLite (بدون Cloudflare)
            org.opencontainers.image.vendor=@sdt144
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo '### ایمیج سلف‌هاست منتشر شد ✔'
            echo ''
            echo '```bash'
            echo 'docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest'
            echo '```'
            echo ''
            echo 'راهنمای کامل: docs/SELF-HOST.fa.md'
          } >> "$GITHUB_STEP_SUMMARY"
