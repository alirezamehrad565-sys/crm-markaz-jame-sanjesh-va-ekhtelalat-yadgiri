<!doctype html>
<!--
  پوستهٔ پنل مدیریت — منو، سایدبار و لودینگ ماژول‌ها با نسخه (?v=)
  سامانهٔ مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام · @sdt144
-->

<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام</title>
  <meta name="description" content="سامانه مدیریت نوبت‌دهی، سنجش، کارکنان و مدارس — مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام" />
  <meta name="theme-color" content="#12384f" />
  <!-- m106 — نشان جدید مرکز + PWA: favicon برداری + PNG نسخه‌دار (با هر انتشار «?v=» bump شود) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.00.64" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/logo-32.png?v=1.00.64" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=1.00.64" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v=1.00.64" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- m106 — پیش‌بارگذاری: فونت اصلی + نشان سایدبار/ورود (بهبود LCP) -->
  <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/img/logo-192.png?v=1.00.64" as="image" fetchpriority="high" />
  <!-- m57 — assetهای نسخه‌دار: با هر انتشار «?v=» را در همین فایل bump کنید
       تا کش یک‌سالهٔ immutable ــ/ِassets/* در _headers── باطل شود (cache busting) -->
  <link rel="stylesheet" href="/assets/css/tokens.css?v=1.00.64" />
  <link rel="stylesheet" href="/assets/css/base.css?v=1.00.64" />
  <link rel="stylesheet" href="/assets/css/components.css?v=1.00.64" />
  <link rel="stylesheet" href="/assets/css/views.css?v=1.00.64" />
  <script src="/assets/js/theme-boot.js?v=1.00.64"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand__logo">
          <img src="/assets/img/logo-192.png?v=1.00.64" alt="نشان مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام" width="40" height="40" />
        </div>
        <div>
          <div class="brand__name">مرکز جامع سنجش، آموزش، توان‌بخشی و مداخلات بهنگام</div>
          <div class="brand__sub">سامانهٔ مدیریت نوبت‌دهی و مراجعان</div>
        </div>
      </div>

      <nav class="nav" aria-label="ناوبری اصلی"></nav>

      <div class="sidebar__foot">
        <!-- m143 — نسخه از ?v= استایل‌شیت خوانده می‌شود (خودکار با هر انتشار) -->
        <span id="shell-version">نسخه —</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="باز کردن منو">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        </button>
        <!-- m106 — عنوان صفحه فقط یک‌بار: topbar فقط «مسیر راهنما» نشان می‌دهد؛
             عنوان بزرگ صفحه در page-headِ خود نماست (قبلاً دوبار تکرار می‌شد) -->
        <div class="topbar__title-wrap">
          <h1 class="topbar__crumb" id="topbar-crumb" aria-label="مسیر صفحه"></h1>
          <p class="sr-only" id="page-title">داشبورد</p>
        </div>
        <button class="gsearch-btn" id="global-search-btn" aria-label="جستجوی سراسری (Ctrl+K)" title="جستجوی سراسری (Ctrl+K)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
          <span class="gsearch-btn__label">جستجو در همه بخش‌ها…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <button class="btn btn--ghost btn--icon" id="theme-btn" aria-label="تغییر تم"></button>
        <button class="topbar__user" id="user-chip" title="خروج از حساب">
          <span>در حال بارگذاری…</span>
        </button>
      </header>

      <div id="ann-banner-root"></div>
    <main class="content" id="outlet" aria-live="polite"></main>
    </div>
  </div>

  <!-- m59 — ورودی اپ نسخه‌دار OK است (هیچ ماژولی app.js را import نمی‌کند؛ session → state.js).
       هشدار: اگر روزی چیزی app.js را ایمپورت کرد، همین ?v= دوباره باگ «دو بار اجرا» می‌سازد. -->
  <script type="module" src="/assets/js/app.js?v=1.00.64"></script>
  <!-- m106 — ثبت Service Worker (PWA): پس از بار کامل صفحه، بدون رقابت با منابع بحرانی -->
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
